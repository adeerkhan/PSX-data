name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same ref, but never cancel main itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # 20.19.0 is the floor declared in "engines", pinned exactly so a
        # regression against the minimum supported runtime is caught here
        # rather than by a consumer.
        node: ['20.19.0', '22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Typecheck and tests. The suite reads recorded fixtures and never
      # touches the network, so this is safe to run on every push.
      - name: Typecheck and test
        run: npm run check

      - name: Build
        run: npm run build

      # Guards the published artifact: a tsconfig change that drops files, or
      # a "files" edit that ships nothing, fails here instead of on npm.
      - name: Verify publishable tarball
        working-directory: packages/client
        run: npm pack --dry-run